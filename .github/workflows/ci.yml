name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project and dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint with Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Format check with Ruff
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy src/

      - name: Run test suite with pytest
        run: uv run --python ${{ matrix.python-version }} pytest

