name: Daily Challenge Automation

on:
  schedule:
    # 11:45 UTC = 17:15 IST (5:15 PM Asia/Kolkata) daily
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform override (leetcode or codeforces)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-daily:
    name: Execute Daily Challenge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --python 3.12

      - name: Execute Daily Challenge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-2.5-flash
          CODEFORCES_USERNAME: hkvariant
          LEETCODE_USERNAME: hardikkaurani_
          TIMEZONE: Asia/Kolkata
          DAILY_RUN_TIME: "17:15"
          DAILY_POLICY: alternating
          SANDBOX_BACKEND: subprocess
        run: |
          if [ -n "${{ github.event.inputs.platform }}" ]; then
            uv run dc-agent daily --platform "${{ github.event.inputs.platform }}"
          else
            uv run dc-agent daily
          fi

      - name: Upload Daily Problem Workspace Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-problem-workspace
          path: problem_workspace/
          retention-days: 30

      - name: Commit Generated Solutions to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add problem_workspace/ dc_agent.db || true
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(daily): automated daily challenge solution [skip ci]"
            git push
          fi

