name: Daily Challenge Workflow (Manual / CI Verification)

# Automatic scheduled cloud execution is disabled because GitHub-hosted runners
# do not provide hardened Docker container isolation for untrusted AI-generated code.
# Local execution using Docker is the recommended secure environment:
#   uv run dc-agent daily
# Or run the local scheduler daemon:
#   uv run dc-agent schedule

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run check (validates configuration without executing untrusted code)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify DC-Agent Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --python 3.12

      - name: Validate System Status (Dry Run)
        env:
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-2.5-flash
          CODEFORCES_USERNAME: hkvariant
          LEETCODE_USERNAME: hardikkaurani_
          TIMEZONE: Asia/Kolkata
          DAILY_RUN_TIME: "17:15"
          DAILY_POLICY: alternating
          SANDBOX_BACKEND: docker
          ALLOW_INSECURE_FALLBACK: "false"
        run: |
          echo "Running DC-Agent verification..."
          uv run dc-agent status
