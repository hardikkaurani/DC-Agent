[project]
name = "dc-agent"
version = "0.1.0"
description = "Daily Competitive Programming Assistant for LeetCode and Codeforces"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Hardik Kaurani", email = "hardikkaurani@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.12.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "google-genai>=2.34.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "docker>=7.2.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
dc-agent = "dc_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # do not perform function calls in argument defaults (standard for Typer and FastAPI)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async using pytest-asyncio",
]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "win32api",
    "win32job",
    "docker",
    "docker.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.1.post1",
]
